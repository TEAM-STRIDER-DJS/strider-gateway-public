routes:
  - service: feed
  - id: create-feed-post
    inbound: /api/v1/strider/feed
    outbound: /api/v1/feed
  # 리터럴 경로는 /{feedId} 보다 반드시 위에 있어야 함 (먼저 등록된 라우트가 우선 매칭)
  - id: get-saved
    inbound: /api/v1/strider/feed/saved
    outbound: /api/v1/feed/saved
  - id: get-saved-thumbnails
    inbound: /api/v1/strider/feed/saved/thumbnails
    outbound: /api/v1/feed/saved/thumbnails
  - id: get-feed
    inbound: /api/v1/strider/feed/{feedId}
    outbound: /api/v1/feed/{feedId}
  - id: get-follower-feed
    inbound: /api/v1/strider/feed/follow
    outbound: /api/v1/feed/follow
  - id: get-user-feed
    inbound: /api/v1/strider/feed/user/{feedUserId}
    outbound: /api/v1/feed/user/{feedUserId}
  - id: get-my-feed
    inbound: /api/v1/strider/feed/me
    outbound: /api/v1/feed/me
  - id: like-feed
    inbound: /api/v1/strider/feed/{feedId}/like
    outbound: /api/v1/feed/{feedId}/like
    # TODO: HTTP method만 다른 경우는?
  - id: get-feed-like-user
    inbound: /api/v1/strider/feed/{feedId}/like/users
    outbound: /api/v1/feed/{feedId}/like/users
  - id: save-feed
    inbound: /api/v1/strider/feed/{feedId}/save
    outbound: /api/v1/feed/{feedId}/save
  - id: get-comments
    inbound: /api/v1/strider/feed/{feedId}/comment
    outbound: /api/v1/feed/{feedId}/comment
  - id: create-comment
    inbound: /api/v1/strider/feed/comment
    outbound: /api/v1/feed/{feedId}/comment
  - id: get-replies
    inbound: /api/v1/strider/feed/comment/{commentId}/reply
    outbound: /api/v1/feed/comment/{commentId}/reply
  - id: delete-comment
    inbound: /api/v1/strider/feed/comment/{commentId}
    outbound: /api/v1/feed/comment/{commentId}
  - id: like-comment
    inbound: /api/v1/strider/feed/comment/{commentId}/like
    outbound: /api/v1/feed/comment/{commentId}/like
#  - id: get-feed-media
#    inbound: /api/v1/strider/feed/media
#    outbound: /api/v1/feed/media
#  - id: share-feed-url
#    inbound: /api/v1/strider/feed/{feedId}/share-url
#    outbound: /api/v1/feed/{feedId}/share-url
